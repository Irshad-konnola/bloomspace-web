name: Bloomspace CI
on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci # Faster, cleaner install for CI environments

      - name: Type Check
        run: npx tsc --noEmit # This catches those 'window' or 'process' errors

      - name: Lint Check
        run: npm run lint